<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://riyvlhlhzxxerlwqoxsy.supabase.co wss://riyvlhlhzxxerlwqoxsy.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>كلمة مرور جديدة · Faseela</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <style>
    :root { color-scheme: light dark; --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --accent:#424830; --accent-fg:#fff; --err:#b91c1c; --ok:#15803d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --muted:#d6d3d1; --line:#57534e; --accent:#bcc3a1; --accent-fg:#1c1917; --err:#fca5a5; --ok:#86efac; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.6 'Cairo','Plus Jakarta Sans',system-ui,sans-serif; padding:1rem; }
    main { width:100%; max-width:26rem; border:1px solid var(--line); border-radius:1rem; padding:1.5rem; }
    h1 { font-size:1.35rem; margin:0 0 .25rem; } p { margin:.25rem 0 1rem; color:var(--muted); }
    label { display:block; font-weight:600; margin:1rem 0 .25rem; }
    input { width:100%; padding:.75rem; font:inherit; border:1px solid var(--line); border-radius:.75rem; background:transparent; color:inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    button { margin-top:1.25rem; width:100%; padding:.8rem; font:inherit; font-weight:700; border:0; border-radius:.75rem; background:var(--accent); color:var(--accent-fg); cursor:pointer; transition:opacity .15s; }
    button:disabled { opacity:.55; cursor:progress; }
    #status { min-height:1.6em; margin-top:1rem; font-weight:600; }
    #status[data-kind="error"] { color:var(--err); } #status[data-kind="ok"] { color:var(--ok); }
    a { color:var(--accent); } .en { direction:ltr; text-align:left; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
    @media (prefers-reduced-motion: reduce) { button { transition:none; } }
  </style>
</head>
<body>
<main aria-labelledby="title">
  <h1 id="title">تعيين كلمة مرور جديدة</h1>
  <p class="en">Set a new password for your Faseela account.</p>
  <div id="form" hidden>
    <label for="pw1">كلمة المرور الجديدة · New password</label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="10" required aria-describedby="hint">
    <p id="hint">10 أحرف على الأقل · at least 10 characters</p>
    <label for="pw2">تأكيد كلمة المرور · Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="10" required>
    <button id="save" type="button">حفظ · Save</button>
  </div>
  <div id="status" role="status" aria-live="polite">جارٍ التحقق من الرابط… · Checking the link…</div>
  <p><a href="../index.html">العودة إلى التطبيق · Back to the app</a></p>
</main>
<script type="module" src="../supabase-client.mjs"></script>
<script type="module" src="./reset.mjs"></script>
</body>
</html>
