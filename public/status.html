<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://riyvlhlhzxxerlwqoxsy.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Faseela service status · حالة خدمة فسيلة">
  <title>حالة الخدمة · Faseela status</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root { color-scheme: light dark; --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --accent:#424830; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --ok-bg:#dcfce7; --warn-bg:#fef3c7; --err-bg:#fee2e2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --muted:#d6d3d1; --line:#57534e; --accent:#bcc3a1; --ok:#86efac; --warn:#fcd34d; --err:#fca5a5; --ok-bg:#14532d; --warn-bg:#78350f; --err-bg:#7f1d1d; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.6 'Cairo','Plus Jakarta Sans',system-ui,sans-serif; padding:1rem; }
    main { width:100%; max-width:30rem; border:1px solid var(--line); border-radius:1rem; padding:1.5rem; }
    h1 { font-size:1.35rem; margin:0 0 .25rem; } p { margin:.25rem 0 1rem; color:var(--muted); }
    .en { direction:ltr; text-align:left; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
    #overall { display:flex; align-items:center; gap:.6rem; padding:.9rem 1rem; border-radius:.9rem; font-weight:800; margin:1rem 0; background:var(--warn-bg); color:var(--warn); }
    #overall[data-state="ok"] { background:var(--ok-bg); color:var(--ok); }
    #overall[data-state="down"] { background:var(--err-bg); color:var(--err); }
    .dot { width:.8rem; height:.8rem; border-radius:50%; background:currentColor; flex:none; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.7rem 0; border-top:1px solid var(--line); }
    li span:first-child { font-weight:600; }
    .pill { font-size:.8rem; font-weight:700; padding:.15rem .6rem; border-radius:999px; background:var(--warn-bg); color:var(--warn); }
    .pill[data-state="ok"] { background:var(--ok-bg); color:var(--ok); }
    .pill[data-state="down"] { background:var(--err-bg); color:var(--err); }
    footer { margin-top:1.25rem; font-size:.8rem; color:var(--muted); }
    a { color:var(--accent); } a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    @media (prefers-reduced-motion: no-preference) { .pill, #overall { transition: background-color .2s, color .2s; } }
  </style>
</head>
<body>
<main aria-labelledby="title">
  <h1 id="title">حالة خدمة فسيلة</h1>
  <p class="en">Faseela service status — refreshed every 60 seconds.</p>
  <div id="overall" data-state="loading" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="overall-text">جارٍ الفحص… · Checking…</span></div>
  <ul>
    <li><span>الواجهة البرمجية · API</span><span class="pill" id="s-api" data-state="loading">…</span></li>
    <li><span>المهام المجدولة · Scheduled jobs</span><span class="pill" id="s-jobs" data-state="loading">…</span></li>
    <li><span>البريد الإلكتروني · E-mail delivery</span><span class="pill" id="s-email" data-state="loading">…</span></li>
  </ul>
  <footer>
    <span>آخر فحص · Last check: <time id="checked">—</time></span><br>
    <a href="./">العودة إلى فسيلة · Back to Faseela</a>
  </footer>
</main>
<script type="module" src="status.mjs"></script>
</body>
</html>
