<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">فَسِيلَة - Faseela Sovereign Olive Tree</title>
  <desc id="desc">Sovereign Syrian Olive Tree emblem with golden halo, organic roots, and olive fruits inside deep botanical green shield.</desc>
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3322"/>
      <stop offset="50%" stop-color="#122418"/>
      <stop offset="100%" stop-color="#0a150e"/>
    </linearGradient>

    <!-- Warm Golden Ambient Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#fdf4dc" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1b3322" stop-opacity="0"/>
    </radialGradient>

    <!-- Luxury Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa821c"/>
    </linearGradient>

    <!-- Rich Wooden Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e4f2b"/>
      <stop offset="30%" stop-color="#936d3e"/>
      <stop offset="70%" stop-color="#b88f54"/>
      <stop offset="100%" stop-color="#d9b16f"/>
    </linearGradient>

    <!-- Vibrant Olive Leaves Gradient (Lush Syrian Olive Foliage) -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4d872"/>
      <stop offset="45%" stop-color="#8ba744"/>
      <stop offset="100%" stop-color="#556e29"/>
    </linearGradient>

    <linearGradient id="leafGradAlt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8eb82"/>
      <stop offset="50%" stop-color="#97b649"/>
      <stop offset="100%" stop-color="#4e6624"/>
    </linearGradient>

    <!-- Golden Olives Gradient -->
    <linearGradient id="oliveGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fce899"/>
      <stop offset="40%" stop-color="#a4bd48"/>
      <stop offset="85%" stop-color="#698327"/>
      <stop offset="100%" stop-color="#445917"/>
    </linearGradient>

    <!-- Drop Shadows for Dimensional Depth -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Shield (22% radius for modern squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)"/>

  <!-- Subtle Double Gold Filigree Border -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" opacity="0.45"/>
  <rect x="22" y="22" width="468" height="468" rx="90" fill="none" stroke="url(#goldBorder)" stroke-width="1" opacity="0.2"/>

  <!-- Celestial Glow / Spiritual Olive Light Behind Foliage -->
  <circle cx="256" cy="226" r="182" fill="url(#sunGlow)"/>
  <circle cx="256" cy="226" r="156" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.35"/>

  <!-- Fertile Ground / Terraced Furrow Baseline (Sham Terroir) -->
  <path d="M 120 422 Q 256 392 392 422" fill="none" stroke="url(#goldBorder)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 160 435 Q 256 414 352 435" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Deep Ground Taproots -->
  <g stroke="url(#trunkGrad)" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 238 402 Q 210 418 185 422" stroke-width="10"/>
    <path d="M 274 402 Q 302 418 327 422" stroke-width="10"/>
    <path d="M 256 404 L 256 424" stroke-width="12"/>
  </g>

  <!-- Ancient Syrian Olive Trunk & Primary Boughs -->
  <!-- Main Gnarled Trunk -->
  <path d="M 256 405 C 242 355 242 308 256 268 C 265 240 262 210 248 182"
        fill="none" stroke="url(#trunkGrad)" stroke-width="28" stroke-linecap="round"/>
  <!-- Secondary Twisted Fiber Overlay -->
  <path d="M 248 395 C 238 355 244 315 252 276"
        fill="none" stroke="#d9b16f" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Left Primary & Secondary Branches -->
  <path d="M 253 282 C 206 256 162 226 130 184"
        fill="none" stroke="url(#trunkGrad)" stroke-width="17" stroke-linecap="round"/>
  <path d="M 250 228 C 218 206 194 178 180 146"
        fill="none" stroke="url(#trunkGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 195 246 C 168 238 146 220 134 206"
        fill="none" stroke="url(#trunkGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Primary & Secondary Branches -->
  <path d="M 257 274 C 304 250 348 214 382 168"
        fill="none" stroke="url(#trunkGrad)" stroke-width="17" stroke-linecap="round"/>
  <path d="M 264 224 C 294 196 316 164 332 130"
        fill="none" stroke="url(#trunkGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 317 246 C 344 238 366 220 378 206"
        fill="none" stroke="url(#trunkGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Crown Leaves (Lush, Symmetrical yet Organic, Golden-Green Radiance) -->
  <g>
    <!-- Central Upright Leaves -->
    <ellipse cx="256" cy="80" rx="22" ry="54" fill="url(#leafGradAlt)"/>
    <ellipse cx="218" cy="95" rx="21" ry="50" transform="rotate(-18 218 95)" fill="url(#leafGrad)"/>
    <ellipse cx="294" cy="95" rx="21" ry="50" transform="rotate(18 294 95)" fill="url(#leafGrad)"/>

    <!-- Mid Canopy Foliage -->
    <ellipse cx="172" cy="118" rx="22" ry="49" transform="rotate(-34 172 118)" fill="url(#leafGradAlt)"/>
    <ellipse cx="340" cy="118" rx="22" ry="49" transform="rotate(34 340 118)" fill="url(#leafGradAlt)"/>

    <ellipse cx="134" cy="158" rx="23" ry="48" transform="rotate(-50 134 158)" fill="url(#leafGrad)"/>
    <ellipse cx="378" cy="158" rx="23" ry="48" transform="rotate(50 378 158)" fill="url(#leafGrad)"/>

    <!-- Lower Canopy Spreading Foliage -->
    <ellipse cx="112" cy="204" rx="21" ry="45" transform="rotate(-68 112 204)" fill="url(#leafGradAlt)"/>
    <ellipse cx="400" cy="204" rx="21" ry="45" transform="rotate(68 400 204)" fill="url(#leafGradAlt)"/>

    <ellipse cx="158" cy="216" rx="20" ry="44" transform="rotate(-58 158 216)" fill="url(#leafGrad)"/>
    <ellipse cx="354" cy="216" rx="20" ry="44" transform="rotate(58 354 216)" fill="url(#leafGrad)"/>

    <!-- Inner Crown Foliage Layers (Adds Rich Volumetric Density) -->
    <ellipse cx="224" cy="152" rx="19" ry="42" transform="rotate(-22 224 152)" fill="url(#leafGradAlt)" opacity="0.95"/>
    <ellipse cx="288" cy="152" rx="19" ry="42" transform="rotate(22 288 152)" fill="url(#leafGradAlt)" opacity="0.95"/>
    <ellipse cx="256" cy="144" rx="17" ry="38" fill="url(#leafGrad)" opacity="0.9"/>
  </g>

  <!-- Golden Olives with Lustrous Highlights (Symbols of Blessing & Liquid Gold) -->
  <g stroke="url(#goldBorder)" stroke-width="2.5">
    <!-- Left Olive Cluster -->
    <ellipse cx="170" cy="178" rx="15" ry="19" transform="rotate(15 170 178)" fill="url(#oliveGrad)"/>
    <ellipse cx="138" cy="226" rx="13" ry="17" transform="rotate(-15 138 226)" fill="url(#oliveGrad)"/>
    
    <!-- Right Olive Cluster -->
    <ellipse cx="342" cy="178" rx="15" ry="19" transform="rotate(-15 342 178)" fill="url(#oliveGrad)"/>
    <ellipse cx="374" cy="226" rx="13" ry="17" transform="rotate(15 374 226)" fill="url(#oliveGrad)"/>

    <!-- Central High Quality Olives -->
    <ellipse cx="218" cy="188" rx="14" ry="18" transform="rotate(10 218 188)" fill="url(#oliveGrad)"/>
    <ellipse cx="294" cy="188" rx="14" ry="18" transform="rotate(-10 294 188)" fill="url(#oliveGrad)"/>
  </g>

  <!-- Micro Olive Oil Specular Dots (Gleam) -->
  <g fill="#fff" opacity="0.65">
    <circle cx="166" cy="173" r="2.5"/>
    <circle cx="338" cy="173" r="2.5"/>
    <circle cx="214" cy="183" r="2.2"/>
    <circle cx="290" cy="183" r="2.2"/>
    <circle cx="134" cy="222" r="2"/>
    <circle cx="370" cy="222" r="2"/>
  </g>
</svg>
